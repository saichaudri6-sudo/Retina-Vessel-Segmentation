<div id="tray-card" class="railsec tray">
  <div class="lbl">Case</div>
  <div class="tiles">
    <button type="button" class="tile {{ 'on' if case == 'bench' else '' }}" data-case="bench"
            hx-post="/ui/case" hx-target="#bay" hx-swap="innerHTML" hx-include="this"
            hx-vals='{"case":"bench"}' role="group" aria-label="Benchmark sample case">
      <img src="/media/thumb?which=bench" alt="Benchmark sample" width="72" height="72">
    </button>
    <button type="button" class="tile {{ 'on' if case == 'dense' else '' }}" data-case="dense"
            hx-post="/ui/case" hx-target="#bay" hx-swap="innerHTML" hx-include="this"
            hx-vals='{"case":"dense"}' aria-label="Dense sample case">
      <img src="/media/thumb?which=dense" alt="Dense sample" width="72" height="72">
    </button>
    <label class="tile up {{ 'on' if case == 'upload' else '' }}" aria-label="Upload your own fundus image">
      <input type="file" name="file" accept="image/png,image/jpeg,image/tif,image/tiff"
             hx-post="/ui/upload" hx-target="#bay" hx-swap="innerHTML" hx-encoding="multipart/form-data"
             hx-trigger="change" hx-include="this">
      {% if case == 'upload' %}
        <img src="/media/thumb?which=upload" alt="Uploaded image" width="72" height="72" class="upimg">
      {% else %}
        <span class="plus" aria-hidden="true">+</span>
      {% endif %}
    </label>
  </div>
  <div class="tiles-sw" role="tablist" aria-label="Case selection">
    <button type="button" class="swb {{ 'on' if case == 'bench' else '' }}" aria-pressed="{{ 'true' if case == 'bench' else 'false' }}"
            hx-post="/ui/case" hx-target="#bay" hx-swap="innerHTML" hx-vals='{"case":"bench"}'>Benchmark</button>
    <button type="button" class="swb {{ 'on' if case == 'dense' else '' }}" aria-pressed="{{ 'true' if case == 'dense' else 'false' }}"
            hx-post="/ui/case" hx-target="#bay" hx-swap="innerHTML" hx-vals='{"case":"dense"}'>Dense</button>
    <button type="button" class="swb {{ 'on' if case == 'upload' else '' }}" aria-pressed="{{ 'true' if case == 'upload' else 'false' }}"
            hx-post="/ui/case" hx-target="#bay" hx-swap="innerHTML" hx-vals='{"case":"upload"}'>Upload</button>
  </div>
  <div class="srcname">
    {% if case == 'upload' %}
      {{ upload or "Choose a fundus photograph" }}
    {% elif case == 'dense' %}
      Dense microvascular retina
    {% else %}
      Benchmark retinal fundus
    {% endif %}
  </div>
</div>
