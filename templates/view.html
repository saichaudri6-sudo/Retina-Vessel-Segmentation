<div id="eyepiece" class="eyepiece">
  <div class="lenswrap">
    <svg class="flange" viewBox="0 0 100 100" aria-hidden="true" focusable="false">
      <circle cx="50" cy="50" r="48.4" fill="none" stroke="rgba(255,255,255,0.5)"
              stroke-width="0.7" stroke-linecap="round" stroke-dasharray="0.2 3.45"/>
      <circle cx="50" cy="50" r="44.6" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="0.24"/>
    </svg>
    <img class="lens" src="{{ u[mode] }}" width="{{ view }}" alt="{{ title }} — {{ mode }} view"
         style="--lens: {{ view }}px">
  </div>
  <div class="chipbar" role="tablist" aria-label="Eyepiece mode">
    {% for key, label in modes %}
    <button type="button" class="chip {{ 'on' if key == mode else '' }}" aria-pressed="{{ 'true' if key == mode else 'false' }}"
            hx-post="/ui/view" hx-target="#eyepiece" hx-swap="outerHTML" hx-include="#tuneform"
            hx-vals='{"mode":"{{ key }}"}'>{{ label }}</button>
    {% endfor %}
    <span class="palette-lbl" id="palette-root">plate</span>
    {% for pal in ["magma", "inferno", "plasma", "viridis", "jet"] %}
    <button type="button" class="swatch {{ pal }} {{ 'on' if palette == pal else '' }}"
            hx-post="/ui/retune" hx-target="#bay" hx-swap="innerHTML" hx-include="#tuneform"
            hx-vals='{"palette":"{{ pal }}"}' aria-label="Use {{ pal }} palette" tabindex="0"></button>
    {% endfor %}
  </div>
</div>
