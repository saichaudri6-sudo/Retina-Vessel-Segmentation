[tool.ruff]
line-length = 110
target-version = "py311"
# app/colormaps.py is generated; utils/ is the untouched trainable source
extend-exclude = ["app/colormaps.py", "utils"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff.lint.per-file-ignores]
# FastAPI's `= File(None)` default-argument idiom is the framework contract
"app/web/routes.py" = ["B008"]
# scripts bootstrap sys.path before importing project modules
"scripts/*" = ["E402"]
