<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 1000" preserveAspectRatio="none">
  <!-- ambient capillaries for the room gutters — mirrored with CSS scaleX(-1) on the right -->
  <defs>
    <linearGradient id="vf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF4A38" stop-opacity="0"/>
      <stop offset="0.14" stop-color="#FF4A38" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#FF5A40" stop-opacity="1"/>
      <stop offset="0.86" stop-color="#FF4A38" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#FF4A38" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vf2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF4A38" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#FF4A38" stop-opacity="0.5"/>
      <stop offset="0.8" stop-color="#FF4A38" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FF4A38" stop-opacity="0"/>
    </linearGradient>
    <filter id="vg" x="-70%" y="-10%" width="240%" height="120%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <g fill="none" stroke-linecap="round">
    <!-- soft halo twin of the main vessel -->
    <path d="M30 30 C 66 130, 18 220, 52 320 C 84 410, 24 520, 48 640 C 70 750, 30 850, 44 970"
          stroke="url(#vf)" stroke-width="9" opacity="0.45" filter="url(#vg)"/>
    <!-- main vessel -->
    <path d="M30 30 C 66 130, 18 220, 52 320 C 84 410, 24 520, 48 640 C 70 750, 30 850, 44 970"
          stroke="url(#vf)" stroke-width="2.6" vector-effect="non-scaling-stroke"/>
    <!-- secondary strand -->
    <path d="M64 70 C 34 170, 86 260, 40 380 C 6 480, 78 560, 34 690 C 10 780, 66 880, 50 965"
          stroke="url(#vf2)" stroke-width="1.3" vector-effect="non-scaling-stroke"/>
    <!-- fine branches -->
    <path d="M52 320 C 78 360, 88 400, 92 470" stroke="url(#vf2)" stroke-width="1" opacity="0.7" vector-effect="non-scaling-stroke"/>
    <path d="M48 640 C 20 700, 14 780, 22 880" stroke="url(#vf2)" stroke-width="1" opacity="0.65" vector-effect="non-scaling-stroke"/>
    <path d="M78 560 C 96 600, 104 660, 100 730" stroke="url(#vf2)" stroke-width="0.8" opacity="0.5" vector-effect="non-scaling-stroke"/>
  </g>
</svg>
